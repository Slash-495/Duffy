services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duffy-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5001
      - MONGO_URL=mongodb://mongo:27017/duffy
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - JWT_SECRET_KEY=replace_with_a_long_random_32_byte_secret
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - STREAM_API_KEY=${STREAM_API_KEY:-your_stream_api_key_here}
      - STREAM_API_SECRET=${STREAM_API_SECRET:-your_stream_api_secret_here}
      - GEMINI_TIMEOUT_MS=12000
      - GEMINI_MAX_RETRIES=2
      - AI_RATE_LIMIT_FREE=10
      - AI_RATE_LIMIT_PREMIUM=60
      - AI_RATE_LIMIT_PRO=300
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
        required: false

  mongo:
    image: mongo:7.0
    container_name: duffy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: duffy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
